
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도서 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-2">도서 관리</h1>
            <p class="text-secondary mb-0">등록된 도서 목록을 확인할 수 있습니다.</p>
        </div>
        <a th:href="@{/books/new}" class="btn btn-primary">도서 등록</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="px-3">ID</th>
                        <th scope="col">제목</th>
                        <th scope="col">저자</th>
                        <th scope="col">가격</th>
                        <th scope="col">카테고리</th>
                        <th scope="col">ISBN</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td class="px-3" th:text="${book.id}"></td>
                        <td class="fw-semibold" th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td th:text="${#numbers.formatInteger(book.price, 1, 'COMMA')} + '원'"></td>
                        <td>
                            <span class="badge text-bg-light"
                                  th:text="${book.category}"></span>
                        </td>
                        <td th:text="${book.isbn}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="6" class="text-center text-secondary py-5">
                            등록된 도서가 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
